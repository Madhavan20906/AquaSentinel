<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" style="background:#090d16; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="header-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="chart-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Top App Navigation Bar -->
  <rect width="1200" height="64" fill="url(#header-grad)" stroke="#334155" stroke-width="1" />
  <circle cx="36" cy="32" r="14" fill="#0284c7" />
  <path d="M 36 22 C 30 28 28 32 28 36 C 28 40.4 31.6 44 36 44 C 40.4 44 44 40.4 44 36 C 44 32 42 28 36 22 Z" fill="#ffffff" />
  <text x="62" y="38" fill="#f8fafc" font-size="18" font-weight="700">AquaSentinel</text>
  <rect x="180" y="24" width="70" height="20" rx="4" fill="#0f766e" />
  <text x="215" y="38" fill="#5eead4" font-size="10" font-weight="700" text-anchor="middle">INTELLIGENCE</text>

  <!-- Nav Tabs -->
  <text x="320" y="37" fill="#38bdf8" font-size="14" font-weight="600">Overview</text>
  <line x1="320" y1="52" x2="380" y2="52" stroke="#38bdf8" stroke-width="2" />
  <text x="420" y="37" fill="#94a3b8" font-size="14">Sites (24)</text>
  <text x="510" y="37" fill="#94a3b8" font-size="14">Alert Review (1)</text>
  <text x="630" y="37" fill="#94a3b8" font-size="14">Citizen Science</text>
  <text x="760" y="37" fill="#94a3b8" font-size="14">Analytics &amp; Back-Test</text>
  <text x="940" y="37" fill="#94a3b8" font-size="14">FHIR R4 Exchange</text>

  <!-- Role Badge -->
  <rect x="1070" y="20" width="105" height="26" rx="13" fill="#1e293b" stroke="#475569" />
  <circle cx="1084" cy="33" r="5" fill="#22c55e" />
  <text x="1126" y="37" fill="#f1f5f9" font-size="11" font-weight="600" text-anchor="middle">Field Officer</text>

  <!-- Left Column: Site & Map -->
  <g transform="translate(30, 84)">
    <!-- Active Site Banner -->
    <rect width="660" height="120" rx="12" fill="#131b2e" stroke="#334155" />
    <text x="24" y="34" fill="#f8fafc" font-size="18" font-weight="700">Adyar Bridge (ADYAR-01) — Chennai, India</text>
    <text x="24" y="56" fill="#94a3b8" font-size="13">Adyar River Watershed • Sub-basin coastal reach • 13.0067° N, 80.2571° E</text>
    
    <!-- Data Source Badge -->
    <rect x="24" y="74" width="170" height="26" rx="6" fill="#064e3b" stroke="#059669" />
    <text x="109" y="91" fill="#6ee7b7" font-size="11" font-weight="700" text-anchor="middle">● LIVE USGS + METEO FEED</text>

    <rect x="206" y="74" width="140" height="26" rx="6" fill="#1e293b" stroke="#475569" />
    <text x="276" y="91" fill="#94a3b8" font-size="11" text-anchor="middle">Confidence: 91% High</text>

    <!-- Leaflet OpenStreetMap Container Mockup -->
    <g transform="translate(0, 136)">
      <rect width="660" height="420" rx="12" fill="#1e293b" stroke="#334155" />
      <!-- Simulated map background tiles -->
      <path d="M 0 160 Q 200 120 400 200 T 660 250 L 660 330 Q 400 280 200 200 T 0 240 Z" fill="#0e3a5a" opacity="0.6" />
      <path d="M 120 0 L 140 420 M 340 0 L 320 420 M 520 0 L 540 420 M 0 100 L 660 110 M 0 280 L 660 290" stroke="#334155" stroke-width="1.5" stroke-opacity="0.4" />
      <text x="590" y="405" fill="#64748b" font-size="9" text-anchor="end">© OpenStreetMap contributors | Leaflet</text>

      <!-- Map Radar Pin 1 (Critical) -->
      <circle cx="280" cy="180" r="18" fill="#ef4444" opacity="0.25" />
      <circle cx="280" cy="180" r="8" fill="#ef4444" stroke="#ffffff" stroke-width="2" />
      <rect x="210" y="125" width="140" height="40" rx="6" fill="#090d16" stroke="#ef4444" />
      <text x="280" y="142" fill="#fca5a5" font-size="10" font-weight="bold" text-anchor="middle">ADYAR-01: Critical (78)</text>
      <text x="280" y="157" fill="#cbd5e1" font-size="9" text-anchor="middle">Turbidity +525% Spike</text>

      <!-- Map Radar Pin 2 (Watch) -->
      <circle cx="480" cy="240" r="6" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5" />
      <text x="495" y="244" fill="#fcd34d" font-size="10" font-weight="bold">BUCK-03: Watch (42)</text>

      <!-- Map Radar Pin 3 (Stable) -->
      <circle cx="150" cy="310" r="6" fill="#10b981" stroke="#ffffff" stroke-width="1.5" />
      <text x="165" y="314" fill="#6ee7b7" font-size="10" font-weight="bold">PALLI-04: Stable (18)</text>
    </g>
  </g>

  <!-- Right Column: Alert Explainer & Metrics -->
  <g transform="translate(710, 84)">
    <!-- AI Alert Explainer Card -->
    <rect width="460" height="230" rx="12" fill="#131b2e" stroke="#3b82f6" stroke-width="1.5" />
    <rect x="18" y="16" width="160" height="24" rx="4" fill="#1e3a8a" />
    <text x="98" y="32" fill="#93c5fd" font-size="11" font-weight="bold" text-anchor="middle">EXPLAINABLE AI ENGINE</text>

    <text x="18" y="65" fill="#f8fafc" font-size="15" font-weight="700">Emerging Anomaly Explanation</text>
    <text x="18" y="88" fill="#94a3b8" font-size="12">Rolling z-score flagged critical excursion on Turbidity:</text>

    <!-- Factor badges -->
    <rect x="18" y="100" width="424" height="65" rx="8" fill="#090d16" stroke="#1e293b" />
    <text x="30" y="122" fill="#38bdf8" font-size="11" font-weight="bold">Evidence Citation:</text>
    <text x="30" y="140" fill="#cbd5e1" font-size="11">"Turbidity is 75 NTU (+525% vs baseline), DO is 3.2 mg/L (-62%),</text>
    <text x="30" y="154" fill="#cbd5e1" font-size="11">supported by 8 citizen reports. Projected breach in ~6h."</text>

    <!-- Dispatch Buttons -->
    <rect x="18" y="180" width="130" height="34" rx="6" fill="#e11d48" />
    <text x="83" y="202" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">Confirm Alert</text>
    <rect x="160" y="180" width="130" height="34" rx="6" fill="#0284c7" />
    <text x="225" y="202" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">Telegram Alert</text>
    <rect x="302" y="180" width="138" height="34" rx="6" fill="#1e293b" stroke="#475569" />
    <text x="371" y="202" fill="#cbd5e1" font-size="12" text-anchor="middle">Dismiss (False Alarm)</text>

    <!-- Live Telemetry Card -->
    <g transform="translate(0, 246)">
      <rect width="460" height="150" rx="12" fill="#131b2e" stroke="#334155" />
      <text x="18" y="28" fill="#f8fafc" font-size="14" font-weight="700">Real-Time Metric Stream</text>
      
      <!-- Metric Row 1 -->
      <text x="18" y="58" fill="#94a3b8" font-size="12">Turbidity</text>
      <text x="140" y="58" fill="#ef4444" font-size="14" font-weight="bold">75.0 NTU</text>
      <rect x="230" y="44" width="70" height="20" rx="4" fill="#450a0a" stroke="#dc2626" />
      <text x="265" y="58" fill="#fca5a5" font-size="10" font-weight="bold" text-anchor="middle">+525% (+4.2σ)</text>
      <rect x="315" y="44" width="65" height="20" rx="4" fill="#064e3b" />
      <text x="347" y="58" fill="#6ee7b7" font-size="10" text-anchor="middle">LIVE USGS</text>

      <!-- Metric Row 2 -->
      <text x="18" y="92" fill="#94a3b8" font-size="12">Dissolved O₂</text>
      <text x="140" y="92" fill="#f59e0b" font-size="14" font-weight="bold">3.2 mg/L</text>
      <rect x="230" y="78" width="70" height="20" rx="4" fill="#451a03" stroke="#d97706" />
      <text x="265" y="92" fill="#fcd34d" font-size="10" font-weight="bold" text-anchor="middle">-62% Stress</text>
      <rect x="315" y="78" width="65" height="20" rx="4" fill="#064e3b" />
      <text x="347" y="92" fill="#6ee7b7" font-size="10" text-anchor="middle">LIVE NWIS</text>

      <!-- Metric Row 3 -->
      <text x="18" y="126" fill="#94a3b8" font-size="12">Rainfall (24h)</text>
      <text x="140" y="126" fill="#38bdf8" font-size="14" font-weight="bold">55.0 mm</text>
      <rect x="230" y="112" width="70" height="20" rx="4" fill="#082f49" stroke="#0284c7" />
      <text x="265" y="126" fill="#7dd3fc" font-size="10" font-weight="bold" text-anchor="middle">+450% Rain</text>
      <rect x="315" y="112" width="80" height="20" rx="4" fill="#064e3b" />
      <text x="355" y="126" fill="#6ee7b7" font-size="10" text-anchor="middle">OPEN-METEO</text>
    </g>

    <!-- Citizen Science Loop Card -->
    <g transform="translate(0, 410)">
      <rect width="460" height="146" rx="12" fill="#131b2e" stroke="#334155" />
      <text x="18" y="28" fill="#f8fafc" font-size="14" font-weight="700">Citizen Observation Status Tracker</text>
      <text x="18" y="48" fill="#94a3b8" font-size="11">Track Token: #OBS-9041 • Semmencherry Channel</text>
      
      <!-- 4 Stages Progress Bar -->
      <line x1="40" y1="85" x2="420" y2="85" stroke="#334155" stroke-width="4" />
      <line x1="40" y1="85" x2="300" y2="85" stroke="#10b981" stroke-width="4" />

      <circle cx="40" cy="85" r="10" fill="#10b981" />
      <text x="40" y="112" fill="#6ee7b7" font-size="10" text-anchor="middle">Submitted</text>

      <circle cx="160" cy="85" r="10" fill="#10b981" />
      <text x="160" y="112" fill="#6ee7b7" font-size="10" text-anchor="middle">AI Triaged</text>

      <circle cx="280" cy="85" r="10" fill="#10b981" />
      <text x="280" y="112" fill="#6ee7b7" font-size="10" text-anchor="middle">Officer Review</text>

      <circle cx="400" cy="85" r="10" fill="#334155" stroke="#64748b" stroke-width="2" />
      <text x="400" y="112" fill="#94a3b8" font-size="10" text-anchor="middle">Action Taken</text>
    </g>
  </g>
</svg>
