kind = "web"
previewPath = "/"
title = "AquaSentinel"
description = "A polished environmental intelligence platform that turns citizen observations and ecological signals into explainable early warnings, human verification workflows, and resilience actions for urban waterways."
version = "1.0.0"
id = "artifacts/aquasentinel"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21925

[services.development]
run = "pnpm --filter @workspace/aquasentinel run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/aquasentinel", "run", "build" ]
serve = "static"
publicDir = "artifacts/aquasentinel/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21925"
BASE_PATH = "/"
